services:
  p1-test-postgres:
    image: postgres:17-alpine
    container_name: erp-p1-test-postgres
    environment:
      POSTGRES_USER: p1_test
      POSTGRES_PASSWORD: p1_test_only
      POSTGRES_DB: erp_p1_test_a
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U p1_test -d erp_p1_test_a"]
      interval: 2s
      timeout: 3s
      retries: 20
