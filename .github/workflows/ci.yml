name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: p1_test
          POSTGRES_PASSWORD: p1_test_only
          POSTGRES_DB: erp_p1_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U p1_test -d erp_p1_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: web
    env:
      DATABASE_URL: postgresql://p1_test:p1_test_only@localhost:5432/erp_p1_ci
      P1_TEST_DATABASE_URL: postgresql://p1_test:p1_test_only@localhost:5432/erp_p1_ci
      LOG_LEVEL: error
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run prisma:validate
      - run: npm run prisma:generate
      - run: npm run db:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:db
      - run: npm run build
